name: Public repository quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact public revision
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "$REPOSITORY_URL"
          git fetch --depth=1 origin "$REVISION"
          git -c advice.detachedHead=false checkout --detach FETCH_HEAD

      - name: Create isolated Python environment
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --requirement requirements.lock
          .venv/bin/python -m pip install --disable-pip-version-check --no-deps --editable .

      - name: Audit publishable files
        run: .venv/bin/python scripts/audit_publication.py

      - name: Run static checks
        run: |
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .
          .venv/bin/python -m mypy .

      - name: Run offline tests
        run: |
          mkdir -p .pytest_cache
          .venv/bin/python -m pytest -m "not live" \
            --basetemp=.pytest_cache/public-quality
